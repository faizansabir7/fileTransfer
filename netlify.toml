[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN (not DENY): streaming downloads use a hidden same-origin iframe
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
